function reset(){busy=false;namePending=false;clearInterval(timer);$('merge-confirm').disabled=false;$('merge-cancel').disabled=false;$('merge-options').hidden=false;}
button.onclick=()=>{if(busy){panel.classList.add('open');return;}customName=false;nameSignature='';nameRequest++;namePending=true;$('merge-confirm').disabled=true;labels={video:'',subtitle:''};status();panel.classList.add('open');iina.postMessage('merge-list-request');iina.postMessage('asr-config-request');};$('merge-select').onclick=()=>iina.postMessage('merge-select');$('merge-name').oninput=()=>{customName=true;nameRequest++;namePending=false;$('merge-confirm').disabled=false;};
function chooseSubtitle(value){subs=value;$('merge-with-subtitles').classList.toggle('active',subs);$('merge-without-subtitles').classList.toggle('active',!subs);render();}$('merge-with-subtitles').onclick=()=>chooseSubtitle(true);$('merge-without-subtitles').onclick=()=>chooseSubtitle(false);
function chooseScaling(value){scaling=value==='fill'?'fill':'fit';$('merge-fit').classList.toggle('active',scaling==='fit');$('merge-fill').classList.toggle('active',scaling==='fill');}$('merge-fit').onclick=()=>chooseScaling('fit');$('merge-fill').onclick=()=>chooseScaling('fill');
function chooseQuality(value){quality=value;$('merge-best').classList.toggle('active',value==='best');$('merge-compressed').classList.toggle('active',value==='compressed');$('merge-default').classList.toggle('active',value==='default');}$('merge-default').onclick=()=>chooseQuality('default');panel.querySelectorAll('[data-merge-performance]').forEach(b=>b.onclick=()=>{performance=b.dataset.mergePerformance;panel.querySelectorAll('[data-merge-performance]').forEach(x=>x.classList.toggle('active',x===b));});$('merge-best').onclick=()=>chooseQuality('best');$('merge-compressed').onclick=()=>chooseQuality('compressed');
$('merge-volume').oninput=()=>{$('merge-volume-value').textContent=$('merge-volume').value+'%';};$('merge-smart-volume').onchange=()=>{$('merge-volume').disabled=$('merge-smart-volume').checked;$('merge-volume-value').hidden=$('merge-smart-volume').checked;};
$('merge-confirm').onclick=()=>{if(namePending)return;if(needsRecognition()&&!window.smartCaptionASR.valid){labels.video='请先在ASR设置中配置并选择可用的识别引擎或模型。';status();return;}if(items.length<2){labels.video='请至少选择两个媒体文件';status();return;}busy=true;clientId='merge-'+Date.now();started=Date.now();$('merge-confirm').disabled=true;$('merge-options').hidden=true;labels={video:'正在准备合并',subtitle:''};status();timer=setInterval(status,100);iina.postMessage('merge-start',{clientId,items:items.map(x=>({path:x.path,subtitle:x.subtitle})),name:$('merge-name').value,autoName:!customName,subtitles:subs,asr:needsRecognition()?window.smartCaptionASRSelection():null,quality,performance,scaling,volume:Number($('merge-volume').value),smartVolume:$('merge-smart-volume').checked});};$('merge-cancel').onclick=()=>{if(busy){$('merge-cancel').disabled=true;iina.postMessage('merge-cancel',{clientId});}else panel.classList.remove('open');};
iina.onMessage('merge-list',data=>{if(busy)return;items=data.items||[];subs=data.subtitles!==false;$('merge-with-subtitles').classList.toggle('active',subs);$('merge-without-subtitles').classList.toggle('active',!subs);const volume=Number(data.volume);$('merge-volume').value=Number.isFinite(volume)?Math.min(300,Math.max(50,volume)):100;$('merge-volume').oninput();$('merge-smart-volume').checked=data.smartVolume===true;$('merge-smart-volume').onchange();performance=data.performance||'normal';chooseScaling(data.scaling);panel.querySelectorAll('[data-merge-performance]').forEach(x=>x.classList.toggle('active',x.dataset.mergePerformance===performance));chooseQuality(data.quality||'best');panel.querySelector(".caption-action-title").textContent=data.audioOnly?"合并音频":"合并视频";panel.querySelectorAll("#merge-options>.caption-title").forEach((e,i)=>{if(i===1)e.textContent=data.audioOnly?"音频列表":"视频列表";if(i===2)e.textContent=data.audioOnly?"目标音频名称":"目标视频名称";});$("merge-best").textContent=data.audioOnly?"最佳音质":"最佳画质";$("merge-compressed").textContent=data.audioOnly?"压缩音质":"压缩画质";render();});iina.onMessage('merge-add',data=>{if(busy)return;(data.items||[]).forEach(x=>{if(!items.some(i=>i.path===x.path))items.push(x)});render();});iina.onMessage('merge-status',data=>{if(data.id!==clientId)return;labels[data.channel]=data.text;status();});iina.onMessage('merge-error',data=>{if(data.id&&data.id!==clientId)return;reset();labels.video=data.message;status();});iina.onMessage('merge-cancelled',data=>{if(data.id!==clientId)return;reset();panel.classList.remove('open');});iina.onMessage('merge-complete',data=>{if(data.id!==clientId)return;reset();panel.classList.remove('open');});
})();
</script><script>iina.onMessage("media-capabilities",function(data){document.querySelectorAll('#gallery-shot,#note-capture,[data-image-source="frame"],option[value="moment"]').forEach(function(el){el.disabled=!data.hasVideo;});});</script><style>#caption-panel .asr-submenu.apple-help{font-size:12px;line-height:1.35;color:var(--muted)}#summary-panel.summary-running #summary-confirm{display:none!important}#summary-panel.summary-running #summary-cancel{background:#fff!important;color:#1d1d1f!important;opacity:1}</style>

<script>
(function(){
  const $=id=>document.getElementById(id),bar=$('caption-utility-bar'),workbench=$('caption-workbench');
  $('translate').textContent='翻译字幕';
  const launch=document.createElement('button');launch.id='transcript';launch.type='button';launch.textContent='导出文稿';bar.appendChild(launch);
  ['refresh','caption','translate','optimize','transcript'].forEach(id=>bar.appendChild($(id)));
  const panel=document.createElement('div');panel.id='transcript-panel';panel.className='caption-panel';
  panel.innerHTML='<div id="transcript-actions" class="caption-actions" style="display:flex"><div class="caption-action-title">导出文稿</div><div class="caption-action-buttons"><button id="transcript-confirm" type="button">确认</button><button id="transcript-cancel" type="button" class="secondary">取消</button></div></div><div class="caption-title">LLM</div><div class="composer-controls"><select id="transcript-provider" aria-label="导出文稿服务商"></select><select id="transcript-model" aria-label="导出文稿模型"></select></div><div class="caption-title">导出样式</div><div id="transcript-formats" class="choice-row"><button class="choice active" data-format="clipboard" type="button">复制到剪贴板</button><button class="choice" data-format="txt" type="button">导出纯文本文件</button><button class="choice" data-format="md" type="button">导出Markdown文件</button></div><div id="transcript-progress" class="caption-progress" role="status"></div>';
  workbench.appendChild(panel);
  const provider=$('transcript-provider'),model=$('transcript-model'),progress=$('transcript-progress'),confirm=$('transcript-confirm'),cancel=$('transcript-cancel');
  let providers=[],format='clipboard',clientId='',running=false,serial=0,started=0,timer=null,statusText='';
  const original=document.createElement('button');original.id='transcript-original';original.type='button';original.className='secondary';original.textContent='直接导出原文（不使用LLM）';original.style.display='none';panel.appendChild(original);
  function renderStatus(){progress.textContent=statusText+(running?'  已等待'+Math.floor((Date.now()-started)/1000)+'秒':'');}
  function setStatus(value){statusText=value||'';renderStatus();}
  function stopClock(){if(timer)clearInterval(timer);timer=null;}

  function fillModels(){const item=providers.find(p=>p.id===provider.value),old=model.value;model.innerHTML='';(item&&item.models||[]).forEach(value=>model.add(new Option(value,value)));if(Array.from(model.options).some(o=>o.value===old))model.value=old;model.disabled=running||!item||!item.models.length;if(!model.options.length)model.add(new Option('请先在设置中添加模型',''));}
  function updateProviders(items){providers=Array.isArray(items)?items:[];const old=provider.value;provider.innerHTML='';providers.forEach(p=>provider.add(new Option(p.name,p.id)));if(providers.some(p=>p.id===old))provider.value=old;provider.disabled=running||!providers.length;fillModels();}
  function busy(value){running=value;confirm.disabled=value;provider.disabled=value||!providers.length;fillModels();panel.querySelectorAll('[data-format]').forEach(b=>b.disabled=value);}
  function close(){panel.classList.remove('open');workbench.dataset.action='';setStatus('');}
  launch.onclick=function(){workbench.dataset.action='transcript';panel.classList.add('open');setStatus('');};
  provider.onchange=fillModels;
  panel.querySelectorAll('[data-format]').forEach(b=>b.onclick=function(){format=b.dataset.format;panel.querySelectorAll('[data-format]').forEach(x=>x.classList.toggle('active',x===b));});
  function start(originalOnly){if(running)return;if(!originalOnly&&(!provider.value||!model.value)){setStatus('请先在设置中配置LLM并选择模型。');return;}clientId='transcript-'+Date.now()+'-'+(++serial);original.style.display='none';busy(true);stopClock();started=Date.now();setStatus(originalOnly?'正在导出原文…':'正在准备字幕…');timer=setInterval(renderStatus,1000);iina.postMessage('transcript-generate',{clientId:clientId,provider:provider.value,model:model.value,format:format,originalOnly:!!originalOnly});}
  confirm.onclick=()=>start(false);original.onclick=()=>start(true);
  cancel.onclick=function(){if(running){const old=clientId;clientId='';stopClock();busy(false);iina.postMessage('transcript-cancel',{clientId:old});}close();};
  iina.onMessage('transcript-provider-config',data=>updateProviders(data&&data.providers));
  iina.onMessage('transcript-status',data=>{if(data&&data.id===clientId)setStatus(data.message||'');});
  ['complete','error','cancelled'].forEach(name=>iina.onMessage('transcript-'+name,data=>{if(!data||data.id!==clientId)return;stopClock();busy(false);clientId='';setStatus(data.message||(name==='cancelled'?'已取消导出。':''));original.style.display=name==='error'&&data.canExportOriginal?'':'none';}));
  iina.postMessage('provider-config-request');
}());

</script>
